name: bobe-platform
label: BoBe
kind: platform
version: 1.0.0
description: >
  BoBe (Reachy Mini) voice channel for Hermes Agent. Outbound: messages and
  auto-TTS reply audio are POSTed to the BoBe wake daemon on this Mac, which
  relays them over the robot's wake WebSocket so the robot speaks them aloud.
  Inbound: robot utterance transcripts are long-polled from the daemon and
  dispatched as voice messages, so the agent answers by voice.
author: athatheoc
requires_env:
  - name: BOBE_WAKE_TOKEN
    description: "Shared secret of the BoBe wake daemon (same value as the daemon's BOBE_WAKE_TOKEN)"
    prompt: "BoBe wake daemon token"
    password: true
optional_env:
  - name: BOBE_ANNOUNCE_URL
    description: "Wake daemon announce endpoint (default: http://127.0.0.1:8765/v1/announce)"
    prompt: "BoBe announce URL (or empty)"
    password: false
